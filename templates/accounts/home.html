<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Inicial</title>

    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'css/home.css' %}">
</head>
<body>

<header>
    <h1>Meu Projeto</h1>

    <div class="header-actions">
        <a href="{% url 'my_profile' %}" class="profile-icon" title="Meu Perfil">
            {% if request.user.profile.avatar %}
                <img src="{{ request.user.profile.avatar.url }}" alt="Perfil">
            {% else %}
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.4c-3.3 0-9.8 1.7-9.8 4.9v2.5h19.6v-2.5c0-3.2-6.5-4.9-9.8-4.9z"/>
                </svg>
            {% endif %}
        </a>
        <a href="{% url 'logout' %}" class="logout-link">Sair</a>
    </div>
</header>

<main>
    <div class="card">
        <h2>Bem-vindo, {{ request.user.username }} 👋</h2>
        <p>
            Você está logado com sucesso.<br>
            Esta é a página inicial do sistema.
        </p>
    </div>
</main>

</body>
</html>
